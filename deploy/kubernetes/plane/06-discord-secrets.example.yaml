# Example only - do not commit real values.
# The live secret is created by install.sh from apps/discord/.env (or from the
# DISCORD_BOT_TOKEN / PLANE_API_TOKEN environment variables).
apiVersion: v1
kind: Secret
metadata:
  name: discord-secrets
  namespace: plane
type: Opaque
stringData:
  DISCORD_BOT_TOKEN: "CHANGE_ME"
  PLANE_API_TOKEN: "CHANGE_ME"
  # Map of Plane webhook id -> its secret_key: {"<webhook_id>":"plane_wh_..."}
  PLANE_WEBHOOK_SECRETS: "{}"
  PLANE_WEBHOOK_SECRET: ""
