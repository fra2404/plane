apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-config
  namespace: plane
data:
  DEBUG: "0"
  APP_DOMAIN: plane.algios.dev
  WEB_URL: https://plane.algios.dev
  API_BASE_URL: https://plane.algios.dev
  APP_BASE_URL: https://plane.algios.dev
  APP_BASE_PATH: ""
  ADMIN_BASE_URL: https://plane.algios.dev
  ADMIN_BASE_PATH: /god-mode
  SPACE_BASE_URL: https://plane.algios.dev
  SPACE_BASE_PATH: /spaces
  LIVE_BASE_URL: https://plane.algios.dev
  LIVE_BASE_PATH: /live
  CORS_ALLOWED_ORIGINS: https://plane.algios.dev
  # OIDC / SSO (Authentik)
  IS_OIDC_ENABLED: "1"
  OIDC_DISPLAY_NAME: Authentik
  OIDC_ISSUER_URL: https://sso.algios.dev/application/o/plane/
  OIDC_CLIENT_ID: 4E7rgFxG2wTHMT1WveP6C7oRTRJ51QxoIbOzpnQh
  OIDC_REQUIRE_EMAIL_VERIFIED: "0"
  ENABLE_OIDC_SYNC: "0"
  # Authentik groups -> Plane roles
  OIDC_GROUPS_CLAIM: groups
  OIDC_ADMIN_GROUPS: admin
  OIDC_DEFAULT_ROLE: "15"
  OIDC_AUTO_JOIN_WORKSPACES: "1"
  OIDC_WORKSPACE_SLUGS: algios
  OIDC_INSTANCE_ADMIN_GROUPS: admin
  OIDC_GRANT_INSTANCE_ADMIN: "1"
  POSTGRES_USER: plane
  POSTGRES_DB: plane
  POSTGRES_HOST: plane-db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://plane-redis:6379/
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: plane
  RABBITMQ_VHOST: plane
  USE_MINIO: "1"
  MINIO_ENDPOINT_SSL: "1"
  AWS_REGION: us-east-1
  AWS_S3_BUCKET_NAME: uploads
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  FILE_SIZE_LIMIT: "5242880"
  SIGNED_URL_EXPIRATION: "3600"
  API_KEY_RATE_LIMIT: 60/minute
  GUNICORN_WORKERS: "3"
